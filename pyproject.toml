[build-system]
requires = [
    "setuptools>=61",
    "wheel"
]
build-backend = "setuptools.build_meta"

# The version lives in ONE place: _version.py (see PT-13 in AUDIT-2026-09.md).
# setup.py reads the same attribute, so the two can never drift.
[project]
name = "plaque-toolkit"
dynamic = ["version"]
description = "Bacteriophage plaque size & turbidity measurement toolkit (built on the Plaque Size Tool, Trofimova & Jaschke 2021, Apache-2.0)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Michael Baffour Awuah" }]
keywords = ["bacteriophage", "phage", "virus", "viral", "plaque", "size", "turbidity"]
dependencies = [
    "numpy<2",
    "opencv-python>=4.6,<5",
    "imutils>=0.5.4",
    "pandas>=1.3,<3",
    "Pillow>=9",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.13"]
excel = ["openpyxl>=3.0"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/mbaffour/plaque-toolkit"

[tool.setuptools]
py-modules = ["plaque_size_tool", "plaque_turbidity", "_version"]

[tool.setuptools.dynamic]
version = { attr = "_version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
