name: Tests

# Runs the pytest suite (tests/) on every push and pull request. Before this job
# existed, build-macos.yml was the only workflow and it ran no tests at all --
# see AUDIT-2026-09.md (PT-7). The suite is headless and Qt-free by design, so it
# needs only the engine dependencies, not PySide6 / torch / ultralytics.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject.toml and the version the engine
        # was validated on; 3.12 catches anything that only breaks on new Pythons.
        # ubuntu-latest (26.04) no longer provides Python 3.9, so that job runs on an
        # image that still does.
        include:
          - python-version: '3.9'
            os: ubuntu-24.04
          - python-version: '3.12'
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Qt offscreen system libraries (for the headless GUI tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 > /dev/null

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Headless OpenCV: the runner has no display and the suite never shows a window.
          # pillow-heif is required: --smoke measures the bundled sample.heic and
          # fails if it detects nothing.
          # pandas / numpy / matplotlib take the bounds pyproject.toml declares, so CI tests the
          # supported set (an unpinned pandas installed 3.x, which the project does not support).
          # statsmodels, openpyxl, shiny and shinyswatch let the reference-value, Excel and web
          # app tests run instead of skipping.
          pip install opencv-python-headless "numpy<2" "pandas>=1.3,<3" Pillow pillow-heif \
                      imutils "matplotlib>=3.9" scipy pytest \
                      statsmodels openpyxl shiny shinyswatch \
                      "PySide6>=6.4,<6.8" pytest-qt   # tests/test_app_gui.py drives the real app offscreen

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        # -rs lists every skipped test with its reason in the log
        run: python -m pytest -rs

      - name: Engine smoke test
        run: python plaque_app.py --smoke
